name: Build Web to APK (Bubblewrap)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Initialize and Build APK
      run: |
        # Membuat manifest tiruan jika proyek Anda belum memilikinya
        if [ ! -f "manifest.json" ]; then
          echo '{"name":"AI Studio App","short_name":"AIApp","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#000000","icons":[{"src":"https://placeholder.com","sizes":"512x512","type":"image/png"}]}' > manifest.json
        fi
        
        # Proses pembuatan struktur pembungkus APK otomatis
        bubblewrap init --manifest=manifest.json --nointeractive || true
        bubblewrap build --nointeractive || true

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Web-Aplikasi-APK
        path: |
          **/*.apk
