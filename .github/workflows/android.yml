name: Build AI Studio APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Latest Gradle Wrapper
      run: |
        # Mengunduh dan memasang Gradle versi terbaru (8.5) secara portabel
        wget https://gradle.org -P /tmp
        sudo unzip -d /opt/gradle /tmp/gradle-8.5-bin.zip
        export PATH=$PATH:/opt/gradle/gradle-8.5/bin
        
        # Membuat file gradlew baru menggunakan versi gradle terbaru
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      env:
        CI: false
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Studio-APK-Debug
        path: |
          **/build/outputs/apk/debug/*.apk
