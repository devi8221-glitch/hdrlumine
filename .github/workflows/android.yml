name: Build AI Studio APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle and Generate Wrapper
      run: |
        # Mengunduh Gradle secara global agar bisa membuat file gradlew baru
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      env:
        CI: false
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Studio-APK-Debug
        path: |
          **/build/outputs/apk/debug/*.apk
