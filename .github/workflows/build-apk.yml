name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Package Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 6. Configure Android SDK & Build Tools
        run: |
          echo "Configuring Android SDK from $ANDROID_HOME..."
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          # Detect available cmdline-tools / sdkmanager without calling deprecated 'tools' package
          SDK_MGR=""
          for sm in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/*/bin/sdkmanager"; do
            if [ -x "$sm" ]; then
              SDK_MGR="$sm"
              break
            fi
          done

          if [ -n "$SDK_MGR" ]; then
            echo "Using sdkmanager at $SDK_MGR"
            yes | "$SDK_MGR" --licenses || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

          # Add latest build-tools (aapt, zipalign, apksigner, d8) to PATH
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            LATEST_BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LATEST_BT" ] && [ -d "$LATEST_BT" ]; then
              echo "Adding build-tools to PATH: $LATEST_BT"
              echo "$LATEST_BT" >> $GITHUB_PATH
            fi
          fi
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 7. Build & Sign Standalone APK
        run: |
          chmod +x ./scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaHDR-v1.0-release-apk
          path: public/LuminaHDR_v1.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: 9. Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: public/LuminaHDR_v1.0.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## LuminaHDR Android Standalone APK
            - **Versi**: `${{ github.ref_name }}`
            - **Platform**: Android 5.0+ (Lollipop s/d Android 14+)
            - **Fitur**: Full Offline, WebGL2 HDR10 & Dolby Vision Tone-Mapping, Preset TikTok/Instagram/WhatsApp, 3D LUTs.
            - **Unduhan Langsung**: Silakan unduh `LuminaHDR_v1.0.apk` di bawah ini dan instal di perangkat Android Anda.
