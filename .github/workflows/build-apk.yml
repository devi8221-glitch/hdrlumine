name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Package Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 6. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Install Android Build Tools & Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: 8. Build & Sign Standalone APK
        run: |
          chmod +x ./scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: 9. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaHDR-v1.0-release-apk
          path: public/LuminaHDR_v1.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: 10. Create GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: public/LuminaHDR_v1.0.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## LuminaHDR Android Standalone APK
            - **Versi**: `${{ github.ref_name }}`
            - **Platform**: Android 5.0+ (Lollipop s/d Android 14+)
            - **Fitur**: Full Offline, WebGL2 HDR10 & Dolby Vision Tone-Mapping, Preset TikTok/Instagram/WhatsApp, 3D LUTs.
            - **Unduhan Langsung**: Silakan unduh `LuminaHDR_v1.0.apk` di bawah ini dan instal di perangkat Android Anda.
